<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The web application for reporting all the drinks you see Amed drinking">
    <title>GlycAmed</title>
    <link rel="stylesheet" href="/frontend/css/resetCSSAndNavbar.css">
    <link rel="stylesheet" href="/frontend/css/addConsumption.css">
    <link rel="shortcut icon" href="assets/Logo_glycamed.svg" type="image/x-icon">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">
                <img src="./assets/Logo_glycamed.png" alt="Logo_glycamed">
            </a>
            <div class="links">
                <a href="./addConsumption.html">Ajouter une consommation</a>
                <a href="./historique.html">Historique</a>
                <a href="./statistics.html">Statistiques</a>
                <a href="./report.html">Rapport</a>
                <a href="./ranking.html">Classement</a>
            </div>
            <button><a href="login.html">Logout</a></button>
            <div class="burger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <main>
        <h1>Formulaire d'ajout de consommation d'Amed</h1>

        <form class="consumption-form">
            <div class="form-group">
                <label for="product">Produit :</label>
                <input type="text" id="product" name="product" required>
            </div>

            <div class="form-group">
                <label for="quantity">Quantité (en ml) :</label>
                <input type="text" id="quantity" name="quantity" required>
            </div>

            <div class="form-group">
                <label for="datetime">Heure :</label>
                <input type="datetime" id="datetime" name="datetime" required>
            </div>

            <button type="submit" class="consumption-btn">Valider</button>
        </form>
    </main>
    <script>
        const burger = document.querySelector('.burger');
        const links = document.querySelector('.links');

        burger.addEventListener('click', () => {
            links.classList.toggle('open');
        });
    </script>
    <script src="/frontend/js/auth.js"></script>
</body>
</html>
