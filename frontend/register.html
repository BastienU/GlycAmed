<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page d'inscription GlycAmed">
  <title>Inscription | GlycAmed</title>
  <link rel="stylesheet" href="/frontend/css/resetCSSAndNavbar.css">
  <link rel="stylesheet" href="/frontend/css/register.css">
  <link rel="shortcut icon" href="assets/Logo_glycamed.svg" type="image/x-icon">
</head>
<body>
  <header>
    <nav>
      <a href="index.html">
        <img src="./assets/Logo_glycamed.png" alt="Logo_glycamed">
      </a>
      <div class="links">
        <a href="./addConsumption.html">Ajouter une consommation</a>
        <a href="./historique.html">Historique</a>
        <a href="./statistics.html">Statistiques</a>
        <a href="./report.html">Rapport</a>
        <a href="./ranking.html">Classement</a>
      </div>
      <button><a href="login.html">Login</a></button>
      <div class="burger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </nav>
  </header>

  <main>
    <h1>Formulaire d'inscription</h1>

    <form class="register-form">
      <div class="form-group">
        <label for="firstname">Prénom :</label>
        <input type="text" id="firstname" name="firstname" required>
      </div>

      <div class="form-group">
        <label for="lastname">Nom :</label>
        <input type="text" id="lastname" name="lastname" required>
      </div>

      <div class="form-group">
        <label for="email">Email :</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe :</label>
        <input type="password" id="password" name="password" required>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirmer le mot de passe :</label>
        <input type="password" id="confirm-password" name="confirm-password" required>
      </div>

      <button type="submit" class="register-submit-btn">Créer un compte</button>

      <p class="login-text">
        Déjà un compte ?<br>
        <button type="button" class="login-btn"><a href="login.html">Se connecter</a></button>
      </p>
    </form>
  </main>
  <script>
        const burger = document.querySelector('.burger');
        const links = document.querySelector('.links');

        burger.addEventListener('click', () => {
            links.classList.toggle('open');
        });
    </script>
    <script src="/frontend/js/auth.js"></script>
    <script type="module" src="/frontend/js/register.js"></script>
</body>
</html>
